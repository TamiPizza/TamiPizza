<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tamim — Il futuro della Pizza</title>
  <meta name="description" content="Tamim — CS · Pizzaiolo · Muay Thai · Piano. Costruisco TamiPizza." />
  <link rel="icon" type="image/png" href="TamiPizza_Pdp.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream: #f5f0e8;
      --dark: #0a0906;
      --gold: #c8a84b;
      --muted: #6b6256;
      --border: rgba(245,240,232,0.08);
    }

    html, body {
      min-height: 100%;
      background: var(--dark);
      color: var(--cream);
      font-family: 'DM Mono', monospace;
      overflow-x: hidden;
    }

    /* Grain */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.045'/%3E%3C/svg%3E");
      background-size: 180px;
      pointer-events: none;
      z-index: 100;
    }

    /* Glow */
    .glow {
      position: fixed;
      top: -20%;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(200,168,75,0.07) 0%, transparent 65%);
      pointer-events: none;
      z-index: 0;
    }

    .wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4rem 2rem;
      position: relative;
      z-index: 1;
      max-width: 480px;
      margin: 0 auto;
    }

    /* Avatar */
    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid var(--gold);
      margin-bottom: 1.5rem;
      animation: fadeUp 0.7s ease 0.1s both;
      opacity: 0;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Name */
    .name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.8rem;
      font-weight: 300;
      letter-spacing: -0.01em;
      text-align: center;
      opacity: 0;
      animation: fadeUp 0.7s ease 0.2s both;
    }

    .name em {
      font-style: italic;
      color: var(--gold);
    }

    /* Tagline */
    .tagline {
      font-size: 0.62rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      text-align: center;
      margin-top: 0.6rem;
      margin-bottom: 0.4rem;
      opacity: 0;
      animation: fadeUp 0.7s ease 0.3s both;
    }

    .identities {
      font-size: 0.6rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(107,98,86,0.6);
      text-align: center;
      margin-bottom: 2.5rem;
      opacity: 0;
      animation: fadeUp 0.7s ease 0.35s both;
    }

    /* Rule */
    .rule {
      width: 30px;
      height: 1px;
      background: var(--gold);
      margin: 0 auto 2.5rem;
      opacity: 0;
      animation: fadeUp 0.6s ease 0.4s both;
    }

    /* Links */
    .links {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      width: 100%;
      opacity: 0;
      animation: fadeUp 0.7s ease 0.45s both;
    }

    .link-btn {
      display: flex;
      align-items: center;
      gap: 1rem;
      text-decoration: none;
      border: 1px solid var(--border);
      padding: 1rem 1.3rem;
      color: var(--cream);
      transition: border-color 0.2s, background 0.2s, transform 0.15s;
      position: relative;
      overflow: hidden;
    }

    .link-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(200,168,75,0.03);
      opacity: 0;
      transition: opacity 0.2s;
    }

    .link-btn:hover {
      border-color: var(--gold);
      transform: translateY(-2px);
    }

    .link-btn:hover::before {
      opacity: 1;
    }

    .link-btn svg {
      width: 18px;
      height: 18px;
      fill: var(--gold);
      flex-shrink: 0;
    }

    .link-text {
      flex: 1;
    }

    .link-platform {
      font-size: 0.58rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      display: block;
    }

    .link-handle {
      font-size: 0.82rem;
      letter-spacing: 0.05em;
      color: var(--cream);
      display: block;
      margin-top: 0.2rem;
    }

    .link-arrow {
      font-size: 0.7rem;
      color: var(--muted);
      transition: color 0.2s, transform 0.2s;
    }

    .link-btn:hover .link-arrow {
      color: var(--gold);
      transform: translateX(3px);
    }

    /* Footer */
    footer {
      margin-top: 3rem;
      text-align: center;
      opacity: 0;
      animation: fadeUp 0.7s ease 0.8s both;
    }

    footer a {
      font-size: 0.6rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.2s;
    }

    footer a:hover { color: var(--gold); }

    /* Animations */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      .name { font-size: 2.2rem; }
    }
  </style>
</head>
